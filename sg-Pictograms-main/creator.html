<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Nono!</title>
<script src="./js/creator.js" type="module"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<link rel="stylesheet" href="./styles/creator.css">
<link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="m-4 container">
<h1>Nonogram Café</h1>
<h2>Nonogram Creator</h2>
<div>
<form id="creationForm" onsubmit="return false">

<div class="m-2">
<label class="fw-bold d-block">Pattern:</label>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="mode" id="modeImage" value="image" checked>
<label class="form-check-label" for="modeImage">From my image</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="mode" id="modeRandom" value="random">
<label class="form-check-label" for="modeRandom">Random</label>
</div>
</div>

<div id="imageSection" class="m-2 p-3 border rounded">
<label for="imageFile" class="fw-bold">Image:</label>
<input type="file" id="imageFile" class="form-control" accept="image/*">
<div class="form-text">The image never leaves your device. It is only used to draw the pattern; it is not uploaded or stored.</div>
<div id="imageControls" class="mt-3">
<div class="row g-3 align-items-center">
<div class="col-12 col-md-6">
<label for="threshold" class="fw-bold">Black / white cut-off: <span id="thresholdValue">128</span></label>
<input type="range" id="threshold" class="form-range" min="1" max="254" value="128">
</div>
<div class="col-12 col-md-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="invert">
<label class="form-check-label" for="invert">Invert (swap black and white)</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="lockAspect" checked>
<label class="form-check-label" for="lockAspect">Keep image proportions</label>
</div>
</div>
</div>
<div id="sizeHint" class="form-text"></div>
<div class="mt-3">
<canvas id="preview" width="10" height="10"></canvas>
</div>
<div id="previewStatus" class="mt-2"></div>
<div class="form-text">This preview is the picture solvers will uncover. Orange cells were adjusted so the puzzle has exactly one solution.</div>
</div>
</div>

<div class="m-2">
<label for="numRows" class="fw-bold">Rows (<span id="rowsRange">4-25</span>):</label>
<input type="number" id="numRows" class="form-control" name="numRows" value="10" min="4" max="25" required>
</div>
<div class="m-2">
<label for="numCols" class="fw-bold">Columns (<span id="colsRange">4-25</span>):</label>
<input type="number" id="numCols" class="form-control" name="numCols" value="10" min="4" max="25" required>
</div>
<div class="m-2">
<label for="secretText" class="fw-bold">Secret:</label>
<input type="text" id="secretText" class="form-control" name="secretText" value="Abcd3" required>
</div>
<div class="m-2">
<button type="button" id="createBtn" class="btn btn-primary">Create!</button>
</div>
<div id="errorDiv" class="m-2 p-2 bg-danger bg-opacity-10 border border-danger rounded"></div>
</form>
<div id="linkDiv" class="m-2 p-2 bg-info bg-opacity-10 border border-info rounded fw-bold">
<a href="#" target="_blank" id="link"></a>
<div class="mt-2"><button type="button" id="copyBtn" class="btn btn-sm btn-secondary">Copy link</button></div>
</div>
</div>
<p class="text-secondary small mt-4">Based on <a href="https://github.com/RosimInc/sg-nonograms" target="_blank">sg-nonograms</a> by RosimInc (GPL-3.0).</p>
</div>
</body>
</html>
